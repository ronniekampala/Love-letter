<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Khloe ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#ff9a9e,#fecfef,#fad0c4,#ffecd2);font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.heart-float{position:absolute;animation:fall linear infinite;color:#e84393;opacity:0.7}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg)}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
.container{position:relative;z-index:2;max-width:580px;width:100%}
.envelope-wrap{text-align:center;transition:0.8s}
.envelope{width:200px;height:140px;background:#e84393;margin:0 auto;border-radius:0 0 12px 12px;position:relative;cursor:pointer;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
.envelope:before{content:'';position:absolute;top:-70px;left:0;border-left:100px solid transparent;border-right:100px solid transparent;border-bottom:70px solid #ff6b9d}
.tap{margin-top:15px;color:#e84393;font-size:13px;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.card{display:none;background:white;border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,0.25);animation:pop .8s ease}
@keyframes pop{0%{transform:scale(.8) translateY(30px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.photo-wrap{position:relative;height:400px;overflow:hidden;background:#000}
.photo-wrap img{width:100%;height:100%;object-fit:contain}
.photo-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.7));height:120px}
.photo-name{position:absolute;bottom:18px;left:22px;color:white;font-family:'Dancing Script',cursive;font-size:34px;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
.content{padding:28px 26px 24px}
h1{font-family:'Dancing Script',cursive;font-size:38px;color:#e84393}
.sub{font-size:11px;color:#ff8a9b;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px}
.letter{color:#555;line-height:1.9;font-size:14.8px;min-height:220px}
.signature{text-align:right;font-family:'Dancing Script',cursive;font-size:26px;color:#e84393;margin-top:20px}
.btns{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:13px;border-radius:30px;text-align:center;text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;border:none}
.btn-primary{background:#e84393;color:white}
.btn-secondary{background:#fff0f3;color:#e84393}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="container">
  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope" onclick="openLetter()"><div style="color:white;padding-top:50px;font-weight:600">FOR KHLOE 💌</div></div>
    <div class="tap">Tap to open your letter 👆</div>
  </div>
  <div class="card" id="card">
    <div class="photo-wrap">
      <img src="Screenshot_20260822-231216_Photos.jpg" alt="Khloe">
      <div class="photo-overlay"></div>
      <div class="photo-name">Khloe ✨ My Neighbour</div>
    </div>
    <div class="content">
      <h1>Dear Khloe,</h1>
      <div class="sub">My Beautiful Neighbour</div>
      <div class="letter" id="letter"></div>
      <div class="signature" id="signature" style="display:none">Yours truly,<br>Ronnie — your neighbour ❤️</div>
      <div class="btns" id="btns" style="display:none">
        <a class="btn btn-primary" href="#" onclick="alert('Screenshot this and send to Ronnie: Hi neighbour, I saw your letter ❤️');return false;">Say Hi Back? 💬</a>
        <a class="btn btn-secondary" href="#" onclick="heartsExplosion();return false;">I Love It! ❤️</a>
      </div>
    </div>
  </div>
</div>
<script>
const text=`Maybe this is unexpected, coming from the guy next door... but I couldn't keep this in my heart anymore.\n\nEvery time I see you - that beautiful smile, those cute glasses, the way you light up - my whole day becomes better.\n\nKhloe, you are not just beautiful outside, you have this calm, sweet energy that makes our whole neighbourhood feel brighter. I find myself looking forward to seeing you, even if it's just for a second by the gate.\n\nI made this little website just for you, so you will always have a place that tells you how special you are to someone next door.\n\nI would love to know you more... maybe a walk, a soda, a chat - anything you are comfortable with?\n\nYou are amazing, Khloe. And someone next door has liked you for a long time.`;
function createHeart(){const h=document.createElement('div');h.className='heart-float';h.innerHTML='❤️';h.style.left=Math.random()*100+'vw';h.style.fontSize=(Math.random()*20+12)+'px';h.style.animationDuration=(Math.random()*3+3)+'s';document.getElementById('hearts').appendChild(h);setTimeout(()=>h.remove(),6000);}setInterval(createHeart,300);
function openLetter(){document.getElementById('envelopeWrap').style.display='none';document.getElementById('card').style.display='block';typeWriter();}
let i=0;function typeWriter(){if(i<text.length){document.getElementById('letter').innerHTML+=text.charAt(i)=='\n'?'<br><br>':text.charAt(i);i++;setTimeout(typeWriter,28);}else{document.getElementById('signature').style.display='block';document.getElementById('btns').style.display='flex';}}
function heartsExplosion(){for(let k=0;k<30;k++)setTimeout(createHeart,k*80);alert('You made Ronnie the happiest neighbour ever! ❤️');}
</script>
</body>
</html>
